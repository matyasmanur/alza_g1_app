services:
  web-sim:
    build:
      context: .
      target: web-sim
    ports: ["127.0.0.1:8001:8000"]
    environment:
      G1_MEASURE_LATENCY: ${G1_MEASURE_LATENCY:-0}
      G1_SIM_VIEWER: "0"
    volumes: [".:/work:ro"]
    init: true
    command: ["python", "-B", "-m", "g1_control.web", "--backend", "sim"]

  web-mock:
    profiles: [web-mock]
    build:
      context: .
      target: mock
    ports: ["127.0.0.1:8000:8000"]
    volumes: [".:/work:ro"]
    init: true
    command: ["python", "-B", "-m", "g1_control.web", "--backend", "mock"]

  arm-mock:
    profiles: [arm-mock]
    image: python:3.10-slim
    network_mode: none
    working_dir: /work
    volumes: [".:/work:ro"]
    init: true
    command: ["python", "-B", "-m", "unittest", "discover", "-s", "tests", "-v"]

  arm-sim:
    profiles: [arm-sim]
    build:
      context: .
      target: arm-sim
    image: unitree-g1:arm-sim
    network_mode: none
    volumes: [".:/work:ro"]
    init: true
    command: ["python", "-m", "g1_control.simulator"]
