services:
  web-sim:
    build:
      context: .
      target: web-sim
    platform: linux/arm64
    ports:
      - "127.0.0.1:8001:8000"
      - "127.0.0.1:6080:6080"
    environment:
      G1_MEASURE_LATENCY: ${G1_MEASURE_LATENCY:-0}
      G1_SIM_VIEWER: ${G1_SIM_VIEWER:-1}
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes: [".:/work:ro"]
    init: true
    command:
      - sh
      - -ec
      - |
        if [ "$$G1_SIM_VIEWER" = 1 ]; then
          exec xvfb-run -a -s "-screen 0 1280x900x24" sh -ec '
            x11vnc -localhost -nopw -forever -shared -rfbport 5900 &
            websockify --web /usr/share/novnc 6080 localhost:5900 &
            exec python -B -m g1_control.web --backend sim
          '
        fi
        exec python -B -m g1_control.web --backend sim

  web-mock:
    profiles: [web-mock]
    build:
      context: .
      target: mock
    ports: ["127.0.0.1:8000:8000"]
    volumes: [".:/work:ro"]
    init: true
    command: ["python", "-B", "-m", "g1_control.web", "--backend", "mock"]

  arm-mock:
    profiles: [arm-mock]
    image: python:3.10-slim
    network_mode: none
    working_dir: /work
    volumes: [".:/work:ro"]
    init: true
    command: ["python", "-B", "-m", "unittest", "discover", "-s", "tests", "-v"]

  arm-sim:
    profiles: [arm-sim]
    build:
      context: .
      target: arm-sim
    image: unitree-g1:arm-sim
    platform: linux/arm64
    network_mode: none
    volumes: [".:/work:ro"]
    init: true
    command: ["python", "-m", "g1_control.simulator"]
